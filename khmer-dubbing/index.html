<style>

const queue={n:0,max:2,q:[],add(fn){return new Promise(r=>{this.q.push(async()=>{try{r(await fn())}catch(e){r(e)}});this.pump()})},pump(){while(this.n<this.max&&this.q.length){this.n++;this.q.shift()().finally(()=>{this.n--;this.pump()})}}};

async function api(url,opt,{tag,note,tries=5}={}){

  try{r=await fetch(url,opt)}catch(e){if(i>=tries)throw new Error(t('net2'));if(note)note('↻'+(i+1));await wait(Math.min(2**i,30)*1000);continue}
  if(tag==='groq'){groqQ={rem:r.headers.get('x-ratelimit-remaining-requests'),lim:r.headers.get('x-ratelimit-limit-requests')};render()}
  if(r.ok)return r.json();
  const txt=await r.text();let j={};try{j=JSON.parse(txt)}catch(e){}const msg=(j.error&&j.error.message)||txt.slice(0,160);
  if(r.status===401||r.status===403||(r.status===400&&/API key/i.test(msg)))throw new Error(t('badkey'));
  if(r.status===413)throw new Error(t('big25'));
  if(r.status===429){if(/PerDay|per day|\(RPD\)|\(ASD\)/i.test(txt))throw new Error(t('daily'));
   const ra=+r.headers.get('retry-after')||Math.min(2**i*5,60);if(i>=tries||ra>120)throw new Error(t('rate')+' ('+Math.round(ra)+'s)');
   for(let n=Math.ceil(ra);n>0;n--){if(note)note('⏳'+n+'s');await wait(1000)}continue}
  if(r.status>=500&&i<tries){await wait(2**i*1500);continue}
  throw new Error(msg||'HTTP '+r.status)}}
